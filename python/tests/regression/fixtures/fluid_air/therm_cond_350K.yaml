command: fluid-property
description: airDry thermal conductivity at 350K.
octave_script: |
  addpath('mfiles/Thermal/Model');
  addpath('lib');
  air = GasProperty('airDry');
  k = air.calcThermalConductivity(350);
  disp(jsonencode(struct('value', k)));
python_call:
  module: tests.regression.helpers
  function: air_thermal_conductivity
  args:
    temperature: 350.0
tolerance:
  rtol: 1.0e-6
