command: radiation
description: Concentric cylinders, blackbody, r1=0.05, r2=0.10, L=1.0.
octave_script: |
  addpath('mfiles/Thermal/Formula');
  q = heatTransferConcentricCylinderRadiation(500, 300, 0.05, 0.10, 1.0, 1.0, 1.0);
  disp(jsonencode(struct('q', q)));
python_call:
  module: thermal_cli.formula.radiation
  function: concentric_cylinders
  args:
    T1: 500.0
    T2: 300.0
    r1: 0.05
    r2: 0.10
    L: 1.0
    eps1: 1.0
    eps2: 1.0
tolerance:
  rtol: 1.0e-6
