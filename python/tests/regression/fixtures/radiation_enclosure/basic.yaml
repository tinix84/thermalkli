command: radiation
description: Two-surface enclosure, F12=1, A1=A2=1, eps=0.8, T1=500K, T2=300K.
octave_script: |
  addpath('mfiles/Thermal/Formula');
  q = heatTransferEnclosureRadiation(500, 300, 0.8, 0.8, 1.0, 1.0, 1.0);
  disp(jsonencode(struct('q', q)));
python_call:
  module: thermal_cli.formula.radiation
  function: enclosure
  args:
    T1: 500.0
    T2: 300.0
    eps1: 0.8
    eps2: 0.8
    A1: 1.0
    A2: 1.0
    F12: 1.0
tolerance:
  rtol: 1.0e-6
